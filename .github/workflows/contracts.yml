name: offline-contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,web,eval,api]'
      - run: python -m pytest -q
      - run: python -m dynamic_memory.pipeline.mock_smoke
      - run: python -m pytest -q tests/integration/test_offline_system.py tests/web tests/contract
      - name: Reproduce direct-main synthetic B/C/A/E chain
        run: |
          STATE=$(mktemp -d)
          RESULTS=$(mktemp -d)
          python scripts/offline_integration.py prepare --state "$STATE"
          python scripts/offline_integration.py check --state "$STATE"
          python scripts/offline_integration.py evaluate --state "$STATE" --results "$RESULTS"
