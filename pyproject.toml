[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-memory-sre"
version = "0.1.0"
description = "SRE course dynamic-memory contracts and offline mock scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["streamlit>=1,<2"]
api = ["openai>=1,<3"]
embedding = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
